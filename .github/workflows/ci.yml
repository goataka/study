name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

env:
  NODE_VERSION: "22"

jobs:
  test-and-build:
    name: 単体テスト・ビルド（app）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Node.js 環境のセットアップ
        uses: ./.github/actions/setup-quiz
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint 実行
        run: pnpm run lint

      - name: フォーマット確認（Prettier）
        run: pnpm run format:check

      - name: 単体テスト実行
        run: pnpm run test

      - name: Viteビルド
        run: pnpm run build

  e2e:
    name: E2Eテスト（app）
    runs-on: ubuntu-latest
    container:
      # GHA の container.image では env を参照せず、GHCR イメージを直接指定する
      image: ghcr.io/goataka/study-app-ci:latest
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
      packages: read
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Git safe directory の設定（コンテナ内UID不一致対応）
        run: git config --global --add safe.directory /__w/study/study

      - name: Node.js 環境のセットアップ
        uses: ./.github/actions/setup-quiz
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Viteビルド（E2E用）
        run: pnpm run build

      - name: Playwrightブラウザのインストール（E2E用）
        run: pnpm exec playwright install chromium

      - name: E2Eテスト実行（Gherkin シナリオ）
        run: pnpm run test:e2e

  markdownlint:
    name: Markdownリント
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.COPILOT_CLASSIC || github.token }}

      - name: Node.js のセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: pnpm の有効化
        run: corepack enable

      - name: Markdownの自動修正
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pnpm dlx markdownlint-cli --fix "**/*.md" --ignore node_modules --ignore app/node_modules 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "ci: markdownlint の自動修正 [skip ci]"
            git push
          fi

      - name: reviewdog による Markdown チェック
        uses: reviewdog/action-markdownlint@844fd04b127b0d78328653f182d32988ad41d3d7 # v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: warning
          markdownlint_flags: "."

  request-ci-fix:
    name: CopilotにCI修正を依頼
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - e2e
      - markdownlint
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          needs.test-and-build.result == 'failure' ||
          needs.e2e.result == 'failure' ||
          needs.markdownlint.result == 'failure'
        )
      }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 失敗したジョブ結果を整形
        id: failed-jobs
        shell: bash
        env:
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          MARKDOWNLINT_RESULT: ${{ needs.markdownlint.result }}
        run: |
          set -euo pipefail

          {
            echo "value<<EOF"
            echo "ジョブ結果:"
            [ "${TEST_AND_BUILD_RESULT}" = "failure" ] && echo "- test-and-build: failure"
            [ "${E2E_RESULT}" = "failure" ] && echo "- e2e: failure"
            [ "${MARKDOWNLINT_RESULT}" = "failure" ] && echo "- markdownlint: failure"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: CopilotにCI修正を依頼
        uses: ./.github/actions/fix-gha-error
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          copilot-token: ${{ secrets.COPILOT_CLASSIC }}
          workflow-name: ${{ github.workflow }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          head-branch: ${{ github.head_ref }}
          pr-number: ${{ github.event.pull_request.number }}
          error-context: ${{ steps.failed-jobs.outputs.value }}
