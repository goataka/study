name: Fix GHA Error

# 監視対象のワークフローが失敗で完了した場合に発動し、Copilotに修正を依頼する
# PRがある場合はPRにCopilotをメンションしてコメント、
# PRがない場合はIssueを作成してCopilotをアサインする（同一ワークフローのIssueがあればコメントを追加）

on:
  workflow_run:
    # ここに監視するワークフロー名を列挙する（各ワークフローの name: フィールドと完全一致が必要）
    workflows:
      - "CI"
      - "Review Merged Diff On Develop"
      - "Deploy to GitHub Pages"
      - "Build App CI Image"
      - "リリースPR作成"
      - "Release App Artifact"
    types:
      - completed

jobs:
  fix-error:
    name: CopilotにCI修正を依頼
    runs-on: ubuntu-latest
    # ワークフローが失敗で完了し、かつトリガー元が同一リポジトリの場合のみ実行する（fork対策）
    # CI ワークフローは develop ブランチでの失敗のみ監視する
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.name == 'Deploy to GitHub Pages' ||
        github.event.workflow_run.name == 'CI'
      )
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.COPILOT_CLASSIC }}

      - name: CopilotにCI修正を依頼
        uses: ./.github/actions/fix-gha-error
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          copilot-token: ${{ secrets.COPILOT_CLASSIC }}
