name: Build App CI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/docker/app-ci/Dockerfile"
      - ".github/workflows/build-app-ci-image.yml"
  pull_request:
    paths:
      - ".github/docker/app-ci/Dockerfile"
      - ".github/workflows/build-app-ci-image.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/study-app-ci
  PLAYWRIGHT_VERSION: "1.59.1"
  PLAYWRIGHT_BDD_VERSION: "8.5.0"

jobs:
  build-and-push:
    name: アプリCI用イメージのビルド
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Buildx のセットアップ
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GHCR にログイン
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker メタデータ生成
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # main ブランチから配布する共通実行環境として、latest タグのみを公開する
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: イメージのビルドとプッシュ
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .github/docker/app-ci
          file: .github/docker/app-ci/Dockerfile
          build-args: |
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
            PLAYWRIGHT_BDD_VERSION=${{ env.PLAYWRIGHT_BDD_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
